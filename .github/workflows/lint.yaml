name: Lint with Ruff
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ruff-action stopped publishing moving major tags in v4, so this pin has
      # to be a full version. Dependabot keeps it current.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          # Pinned: an unpinned ruff drifts to whatever is latest at run time.
          version: "0.16.2"
          src: "./src"
