name: Lint with Ruff
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          # Pinned: an unpinned ruff drifts to whatever is latest at run time.
          version: "0.15.22"
          src: "./src"
