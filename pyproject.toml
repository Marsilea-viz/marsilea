[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "marsilea"
description = "Declarative creation of composable visualizations"
authors = [
    {name = "Yimin Zheng", email = "yzheng@cemm.at"},
    {name = "Zhihang Zheng", email = "zhihang.zheng@connect.polyu.hk"},
]
license = {file = "LICENSE"}
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Matplotlib",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = [
    "visualization",
    "matplotlib",
    "heatmap",
    "complex-heatmap",
    "annotated-heatmap",
    "oncoprint",
    "upset-plot",
    "sequence-logo",
    "bioinformatics",
    "single-cell",
]
dynamic = ["version"]
requires-python = ">=3.11"
urls = { Home="https://github.com/Marsilea-viz/marsilea", Documentation="https://marsilea.readthedocs.io", Source="https://github.com/Marsilea-viz/marsilea", Issues="https://github.com/Marsilea-viz/marsilea/issues"}
dependencies = [
    "numpy",
    "pandas[parquet]",
    "matplotlib>=3.6",
    "seaborn",
    "scipy",
    "legendkit>=0.4.1",
    "platformdirs",
]

[project.optional-dependencies]
fast = ["fastcluster"]
stats = ["statannotations>=0.7", "statsmodels"]
# anndata.acc (the accessor/reference API) landed in anndata 0.13, which requires
# Python >= 3.12; marsilea supports >= 3.11, so the marker is required or resolution
# fails outright on 3.11.
anndata = ["anndata>=0.13; python_version >= '3.12'"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.hooks.version]
path = "src/marsilea/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.wheel]
packages = ["src/marsilea", "src/oncoprinter"]

[tool.hatch.build.targets.sdist]
exclude = [
    "docs",
    "app",
    "data",
    "img",
    "tests",
    "scripts",
    "readthedocs.yaml",
]
include = [
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "setup.py",
    "src/marsilea",
    "src/oncoprinter",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# Ruff's historic default rule set, made explicit so a ruff upgrade cannot
# silently widen it (0.16.0 grew the default from 59 rules to 413).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"docs/*" = ["E402", "E731"]
"scripts/*" = ["E402", "E731"]

[tool.taskipy.tasks]
hello = "echo Hello, World!"
test = "pytest tests"
doc-build = "sphinx-build -b html docs/source docs/build"
doc-clean-build = "python docs/clean_up.py && sphinx-build -b html docs/source docs/build"
doc-serve = "python -m http.server -d docs/build"
fmt = "ruff format docs/source wsidata tests"

[dependency-groups]
dev = [
    "sphinx>=7.1.2",
    "ruff",
    "pytest",
    "scikit-learn",
    "statannotations>=0.7",
    "statsmodels",
    "sphinx",
    "numpydoc",
    "sphinx_design",
    "pydata-sphinx-theme",
    "sphinx-copybutton",
    "sphinx_gallery",
    "mpl_fontkit",
    "prek",
    "taskipy",
    "emoji>=2.14.1",
    "notebook>=7.3.3",
    "ipykernel>=6.29.5",
    "pip>=25.0.1",
    # Same marker as the `anndata` extra: the 3.11 CI leg resolves without it and
    # the reference tests skip themselves there.
    "anndata>=0.13; python_version >= '3.12'",
    # A second container speaking the same accessor protocol, so the source
    # registry is exercised by more than one implementation.
    "mudata>=0.4; python_version >= '3.12'",
]
